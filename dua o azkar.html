<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sana Islamic - दुआएँ और अज़कार</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #fffde7);
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #075e2b;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

.dua-card {
    background: white;
    margin: 15px 0;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.dua-title {
    text-align: center;
    color: #087f3d;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.arabic {
    direction: rtl;
    text-align: right;
    font-size: 28px;
    line-height: 2.2;
    margin-bottom: 15px;
}

.urdu {
    direction: rtl;
    text-align: right;
    font-size: 21px;
    line-height: 2;
    color: #333;
    margin-bottom: 12px;
}

.hindi {
    text-align: left;
    font-size: 19px;
    line-height: 1.8;
    color: #444;
}

</style>

</head>

<body>

<div class="container">

<h1>🤲 दुआएँ और अज़कार</h1>

<div class="subtitle">
Sana Islamic
</div>

<!-- दुआ नंबर 1 -->

<div class="dua-card">

<div class="dua-title">
दुआ 1
</div>

<div class="arabic">
اللَّهُمَّ اغْفِرْ لِي
</div>

<div class="urdu">
اے اللہ! مجھے بخش دے۔
</div>

<div class="hindi">
ऐ अल्लाह! मुझे माफ़ फरमा।
</div>

</div>


<!-- दुआ नंबर 2 -->

<div class="dua-card">

<div class="dua-title">
दुआ 2
</div>

<div class="arabic">
رَبِّ زِدْنِي عِلْمًا
</div>

<div class="urdu">
اے میرے رب! میرے علم میں اضافہ فرما۔
</div>

<div class="hindi">
ऐ मेरे रब! मेरे इल्म में बढ़ोतरी फरमा।
</div>

</div>


</div>

</body>
</html>
