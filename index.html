<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huda Islamic Talim</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #073b2a;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
    min-height: 100vh;

    background:
    radial-gradient(circle at top, #fffdf2, #eaf7ee 70%);
}

/* HEADER */

.header {
    text-align: center;
    padding: 22px 10px 25px;
    margin-bottom: 15px;
    border-radius: 25px;

    background: linear-gradient(135deg, #075e45, #0c8b65);
    color: white;

    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.header .urdu {
    direction: rtl;
    font-size: 24px;
    margin-bottom: 5px;
}

.header p {
    font-size: 16px;
    opacity: 0.95;
}

/* BUTTON */

.islamic-button {

    width: 100%;
    min-height: 125px;

    display: flex;
    align-items: center;

    border: 3px solid;
    border-radius: 25px;

    margin-bottom: 15px;
    padding: 10px;

    background: white;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,0.15);

    transition: 0.25s;
}

.islamic-button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 9px 18px rgba(0,0,0,0.22);
}

.islamic-button:active {
    transform: scale(0.98);
}

/* ICON */

.icon {

    width: 100px;
    height: 100px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;

    flex-shrink: 0;

    box-shadow:
        inset 0 0 0 4px rgba(255,255,255,0.35);
}

/* TEXT */

.text {
    flex: 1;
    text-align: center;
    padding: 5px 10px;
}

.text h2 {
    font-size: 20px;
    color: #222;
    margin-bottom: 7px;
}

.text p {
    font-size: 21px;
    direction: rtl;
    margin-bottom: 6px;
}

.text span {
    font-size: 15px;
    color: #555;
}

/* ARROW */

.arrow {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;

    color: white;

    flex-shrink: 0;
}

/* COLORS */

.quran {
    border-color: #8751a5;
}
.quran .icon {
    background: linear-gradient(135deg,#8751a5,#c58be5);
}
.quran .arrow {
    background: #8751a5;
}


.hadith {
    border-color: #159b8b;
}
.hadith .icon {
    background: linear-gradient(135deg,#159b8b,#55cbb8);
}
.hadith .arrow {
    background: #159b8b;
}


.maloomat {
    border-color: #e47745;
}
.maloomat .icon {
    background: linear-gradient(135deg,#e47745,#ffb06f);
}
.maloomat .arrow {
    background: #e47745;
}


.dua {
    border-color: #4679c5;
}
.dua .icon {
    background: linear-gradient(135deg,#4679c5,#79a9ed);
}
.dua .arrow {
    background: #4679c5;
}


.calendar {
    border-color: #db5c70;
}
.calendar .icon {
    background: linear-gradient(135deg,#db5c70,#f58da0);
}
.calendar .arrow {
    background: #db5c70;
}


.video {
    border-color: #8b4cb0;
}
.video .icon {
    background: linear-gradient(135deg,#8b4cb0,#b87ad6);
}
.video .arrow {
    background: #8b4cb0;
}


.faraiz {
    border-color: #228b65;
}
.faraiz .icon {
    background: linear-gradient(135deg,#228b65,#57bd91);
}
.faraiz .arrow {
    background: #228b65;
}


.namaz {
    border-color: #d19a35;
}
.namaz .icon {
    background: linear-gradient(135deg,#d19a35,#f0c86b);
}
.namaz .arrow {
    background: #d19a35;
}


.masael {
    border-color: #5477b8;
}
.masael .icon {
    background: linear-gradient(135deg,#5477b8,#82a7e2);
}
.masael .arrow {
    background: #5477b8;
}


.qibla {
    border-color: #168b78;
}
.qibla .icon {
    background: linear-gradient(135deg,#168b78,#54c5b2);
}
.qibla .arrow {
    background: #168b78;
}


/* FOOTER */

.footer {
    text-align: center;
    padding: 20px 5px 10px;

    color: #075e45;
    font-size: 17px;
    font-weight: bold;
}


/* MOBILE */

@media (max-width: 500px) {

    .container {
        padding: 10px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header .urdu {
        font-size: 21px;
    }

    .islamic-button {
        min-height: 110px;
        padding: 8px;
        border-radius: 22px;
    }

    .icon {
        width: 78px;
        height: 82px;
        font-size: 38px;
        border-radius: 18px;
    }

    .text h2 {
        font-size: 16px;
    }

    .text p {
        font-size: 17px;
    }

    .text span {
        font-size: 13px;
    }

    .arrow {
        width: 40px;
        height: 40px;
        font-size: 30px;
    }
}

</style>

</head>
